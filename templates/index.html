<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor de Silos de Grano</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Monitor de Silos</h2>
      </div>
      <nav class="nav flex-column">
        <a href="#" class="nav-link active" data-view="dashboard"><span class="me-2">📊</span> Dashboard</a>
        <a href="#" class="nav-link" data-view="silos"><span class="me-2">🏗️</span> Silos</a>
        <a href="#" class="nav-link" data-view="alerts"><span class="me-2">🔔</span> Alertas</a>
        <a href="#" class="nav-link" data-view="history"><span class="me-2">📈</span> Historial</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="py-3 border-bottom bg-white">
        <div class="container d-flex align-items-center justify-content-between">
          <h1 class="h5 mb-0" id="page-title">Dashboard</h1>
          <div class="text-end text-muted small">Última actualización: <span id="last-updated">--</span></div>
        </div>
      </header>

      <section class="container my-4" id="view-container">
        <!-- Dashboard view -->
        <div id="view-dashboard">
          <div id="grid" class="row g-3"></div>
        </div>

        <!-- Silos view -->
        <div id="view-silos" style="display:none">
          <div class="mb-3 history-card p-3">
            <form id="add-silo-form" class="row g-2 align-items-end">
              <div class="col-md-6">
                <label class="form-label">Nombre del silo</label>
                <input id="input-silo-name" class="form-control" placeholder="Silo X" required />
              </div>
              <div class="col-md-3">
                <label class="form-label">Nivel %</label>
                <input id="input-silo-level" type="number" class="form-control" placeholder="75" />
              </div>
              <div class="col-md-3">
                <button class="btn btn-primary w-100" type="submit">Agregar Silo</button>
              </div>
            </form>
          </div>
          <div id="silos-list" class="list-group"></div>
        </div>

        <!-- Alerts view -->
        <div id="view-alerts" style="display:none">
          <div id="alerts-list" class="list-group"></div>
        </div>

        <!-- History view -->
        <div id="view-history" style="display:none">
          <div class="mb-3">
            <label for="history-silo-select" class="form-label">Seleccionar silo:</label>
            <select id="history-silo-select" class="form-select" style="max-width:360px"></select>
          </div>
          <div class="mb-4">
            <canvas id="history-chart" height="150"></canvas>
          </div>
          <div id="history-stats" class="row g-3"></div>
        </div>
      </section>
    </main>
  </div>

  <footer class="text-center text-muted py-3 small">Dashboard creado para monitoreo — Datos simulados</footer>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
